name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q tests
      - name: Run pipeline end-to-end
        run: python src/main.py --data data/breast_cancer.csv --target target --cv 3
      - name: Check outputs exist
        run: test -f results/results.csv && test -f models/best_model.pkl
